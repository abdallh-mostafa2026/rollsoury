<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #FBF5EC; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #warn { display: none; position: fixed; inset-inline: 0; top: 0; z-index: 10;
          background: #B3261E; color: #fff; font-family: Tahoma, Arial, sans-serif;
          font-size: 13px; line-height: 1.5; padding: 9px 14px; text-align: center;
          box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  body.offline #warn { display: block; }
  body.offline #app { height: calc(100% - 58px); margin-top: 58px; }
  @media (min-width: 600px) { body.offline #app { height: calc(100% - 38px); margin-top: 38px; } }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #FBF5EC; font-family: Tahoma, Arial, sans-serif; color: #2B2118; transition: opacity .3s; }
  #splash img { width: 110px; height: 110px; border-radius: 26px; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
  #splash .dot { width: 34px; height: 34px; border: 4px solid #FCE4DC; border-top-color: #D9442A; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #rf { position: fixed; inset-inline-end: 10px; bottom: 10px; width: 42px; height: 42px; border-radius: 50%;
        border: 0; background: rgba(43,33,24,.55); color: #fff; font-size: 20px; line-height: 1; cursor: pointer;
        z-index: 9; opacity: .35; transition: opacity .2s, transform .5s; -webkit-tap-highlight-color: transparent; }
  #rf:hover, #rf:focus { opacity: 1; }
  #rf.busy { opacity: 1; animation: s 1s linear infinite; }
  #msg { position: fixed; inset-inline: 10px; bottom: 62px; z-index: 9; display: none;
         background: #2B2118; color: #fff; font-family: Tahoma, Arial, sans-serif; font-size: 14px;
         padding: 10px 14px; border-radius: 10px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
</style>

<div id="warn"><b>جهاز المحل مقفول</b> — دي النسخة الاحتياطية. أي تعديل تعمله هنا <b>مش هيوصل للمحل</b>.</div>
<iframe id="app" title="رول سوري" allow="autoplay; clipboard-write; fullscreen; geolocation; camera"></iframe>
<button id="rf" title="تحديث الاتصال بالمحل">&#10227;</button>
<div id="msg"></div>
<script>
  /* ============================================================
     صفحة رول سوري الدائمة.
     بتوصل بسيستم جهاز المحل الأول (أسرع وفيه كل الأوردرات)،
     ولو الجهاز مقفول أو النت فصل بتفتح نسخة جوجل مؤقتًا.
     وبتفضل تتابع: أول ما جهاز المحل يرجع بترجعله لوحدها.
     ============================================================ */

  var CLOUD = 'https://script.google.com/a/~/macros/s/AKfycbwo00bxrTichaHZs7cz4SPO7hfeGLyOabkeHirZje2Giiurq9HX7NzhPd33mc9baGgKuA/exec'.replace('/a/~/', '/');
  var EXTRA = location.search + location.hash;   // زي ?page=admin
  var frame = document.getElementById('app');
  var rf    = document.getElementById('rf');
  var msgEl = document.getElementById('msg');

  var current = '';        // اللي شغال في الإطار دلوقتي
  var busy    = false;
  var msgT    = null;

  frame.onload = function () {
    var sp = document.getElementById('splash');
    if (!sp) return;
    sp.style.opacity = 0;
    setTimeout(function () { sp.style.display = 'none'; }, 300);
  };

  function msg(t, ms) {
    msgEl.textContent = t;
    msgEl.style.display = 'block';
    clearTimeout(msgT);
    msgT = setTimeout(function () { msgEl.style.display = 'none'; }, ms || 3000);
  }

  // الشريط الأحمر بيظهر لصفحة الإدارة بس. العميل بيطلب عادي من النسخة
  // الاحتياطية ومحتاجش يتخض.
  var IS_ADMIN = /(^|[?&#])page=admin\b/.test(EXTRA);

  function show(base) {
    base = base.replace(/\/+$/, '');
    var onCloud = (base === CLOUD.replace(/\/+$/, ''));
    document.body.classList.toggle('offline', onCloud && IS_ADMIN);
    if (base === current) return;
    current = base;
    frame.src = base + EXTRA;
  }

  // بنسأل الجهاز: إنت صاحي؟ لو مردش في ثانيتين ونص يبقى مش موجود
  function alive(url) {
    return new Promise(function (ok) {
      if (!url) return ok(false);
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; ok(false); } }, 2500);
      fetch(url.replace(/\/+$/, '') + '/health?t=' + Date.now(), { cache: 'no-store', mode: 'cors' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { if (!done) { done = true; clearTimeout(t); ok(!!(j && j.ok)); } })
        .catch(function () { if (!done) { done = true; clearTimeout(t); ok(false); } });
    });
  }

  // جهاز المحل بيكتب لينكه الحالي في الملف ده لوحده كل ما يتغير
  function linkOfShop() {
    return fetch('link.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { return (j && j.url) ? String(j.url) : ''; })
      .catch(function () { return ''; });
  }

  /* بنقرر نفتح إيه:
     - جهاز المحل صاحي      -> نفتحه (ولو كنا على جوجل نرجعله)
     - الجهاز مش راد        -> جوجل مؤقتًا
     اللي بيتغير لوحده: لما لينك الجهاز يتغير أو يرجع بعد ما كان واقع. */
  function check(manual) {
    if (busy) return Promise.resolve();
    busy = true;
    if (manual) rf.classList.add('busy');
    return linkOfShop().then(function (shop) {
      return alive(shop).then(function (up) {
        if (up) {
          var back = current && current !== shop.replace(/\/+$/, '');
          show(shop);
          if (manual) msg(back ? 'رجعنا لسيستم المحل' : 'كل حاجة شغالة');
          else if (back) msg('سيستم المحل رجع');
          return;
        }
        // الجهاز مش راد
        if (!current) { show(CLOUD); return; }
        if (current !== CLOUD.replace(/\/+$/, '')) {
          // كنا على الجهاز وهو وقع -> ننزل على جوجل مؤقتًا
          show(CLOUD);
          msg('جهاز المحل مش متاح دلوقتي — فتحنا النسخة الاحتياطية');
          return;
        }
        if (manual) msg('جهاز المحل لسه مش متاح');
      });
    }).then(function () {
      busy = false; rf.classList.remove('busy');
    }, function () {
      busy = false; rf.classList.remove('busy');
      if (!current) show(CLOUD);
    });
  }

  rf.onclick = function () { check(true); };

  check(false);                               // أول تحميل
  setInterval(function () { check(false); }, 20000);   // التحديث التلقائي
  // لما ترجع للصفحة بعد ما سيبتها، بنتأكد على طول
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) check(false);
  });
  window.addEventListener('online', function () { check(false); });
</script>
</body>
</html>
